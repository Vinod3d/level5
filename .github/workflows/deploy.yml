name: deploy to ec2
on: 
  push:
    branches:
     
jobs:
  deploy:
    runs-on: Ubuntu
  
    steps:
      - name: checkout code  
        uses: actions/checkout@v4 
      - name: deploy via ssh
        uses: appleboy/ssh-actions@v1
        with:
          host: ${{secrets.SSH_HOST}}
          username: ubuntu
          key: ${{secrets.SSH_KEY}}
          script:  |
            cd ~/level5
            git pull
            sudo docker stop
            sudo docker compose down
            sudo docker compose up -d --build

        
    
